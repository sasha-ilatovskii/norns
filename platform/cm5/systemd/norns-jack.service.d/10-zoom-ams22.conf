[Service]
Environment="NORNS_AUDIO_DEVICE=hw:CARD=AMS22"
EnvironmentFile=-/etc/default/norns-cm5

ExecStart=
ExecStart=/usr/bin/jackd -R -P 95 -d alsa -d ${NORNS_AUDIO_DEVICE} -r 48000 -n 3 -p 128 -S -s

# A USB interface may enumerate after sound.target during boot.
Restart=on-failure
RestartSec=2
